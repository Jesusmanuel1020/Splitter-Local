name: Sync to Hugging Face hub
on:
  push:
    branches: [main, master, Task/Splitter-Local]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate HF token
        run: |
          if [ -z "${{ secrets.SPLITTER_SECRETS }}" ]; then
            echo "Error: SPLITTER_SECRETS is not set in repository secrets"; exit 1
          fi

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.SPLITTER_SECRETS }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git push --force https://oauth2:${HF_TOKEN}@huggingface.co/spaces/jesusmanuel1020/Splitter-Local HEAD:main